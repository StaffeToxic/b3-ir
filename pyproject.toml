[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "b3-ir"
dynamic = ["version"]
description = "Imposto de Renda de ações, FIIs e ETFs da B3: preço médio, apuração mensal, DARF e declaração anual."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Anthony Oliveira", email = "staffetoxic@gmail.com" }]
keywords = ["imposto de renda", "b3", "darf", "fii", "investimentos", "brasil"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: Portuguese (Brazilian)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Accounting",
    "Typing :: Typed",
]
dependencies = [
    "openpyxl>=3.1",
]

[project.optional-dependencies]
# correpy reads SINACOR notes; it depends on PyMuPDF (AGPL-3.0), hence opt-in.
pdf = ["correpy>=0.6,<0.7"]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-openpyxl",
]

[project.scripts]
b3-ir = "b3_ir.cli:main"

[project.urls]
Homepage = "https://github.com/StaffeToxic/b3-ir"
Issues = "https://github.com/StaffeToxic/b3-ir/issues"

[tool.hatch.version]
path = "src/b3_ir/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/b3_ir"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["specs", ".specify", ".claude"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PT011"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "PT", "DTZ"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src/b3_ir"]
