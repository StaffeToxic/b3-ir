name: Release

# A tag v* builds, attests and publishes. Run manually (workflow_dispatch) to build
# and attest without publishing anything, as a dry run of this workflow.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check . && mypy && pytest -q

  python-package:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-package
          path: dist/*

  windows-exe:
    needs: test
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install ".[pdf]" pyinstaller==6.22.3
      - run: >
          pyinstaller --noconfirm --onefile --console --name b3-ir-windows-x64
          --collect-data b3_ir --collect-all pymupdf --collect-submodules correpy
          packaging/b3-ir-web.py
      - name: Smoke test
        shell: bash
        run: |
          ./dist/b3-ir-windows-x64.exe --version
          ./dist/b3-ir-windows-x64.exe --sem-aviso mensal examples/operacoes.csv | grep "DARF 6015: R\$ 91,81"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/b3-ir-windows-x64.exe
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-exe
          path: dist/b3-ir-windows-x64.exe

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [python-package, windows-exe]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: assets
          merge-multiple: true
      - name: Checksums
        run: cd assets && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          {
            cat "docs/releases/${TAG}.md"
            echo
            echo '## SHA-256'
            echo
            echo '```'
            cat assets/SHA256SUMS.txt
            echo '```'
          } > notes.md
          gh release create "$TAG" assets/* --repo "$GITHUB_REPOSITORY" \
            --title "b3-ir ${TAG}" --notes-file notes.md --latest

  pypi:
    # Enabled once the PyPI trusted publisher exists: set the repository variable
    # PYPI_ENABLED=true (Settings > Secrets and variables > Actions > Variables).
    if: startsWith(github.ref, 'refs/tags/v') && vars.PYPI_ENABLED == 'true'
    needs: python-package
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/b3-ir/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-package
          path: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
